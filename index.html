<!DOCTYPE html>

    <!-- Script da Web Share API -->
    <script>
        document.getElementById('shareBtn').addEventListener('click', async () => {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Welliton Moreira | Cosplay',
