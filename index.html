<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welliton Moreira | Cosplay Portfolio</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (Ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Lightbox CSS (Para a Galeria) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css" rel="stylesheet">
    <!-- CSS Customizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Fundo Temático -->
    <div class="bg-image"></div>

    <main class="container min-vh-100 d-flex flex-column justify-content-center align-items-center py-5 position-relative z-1 fade-in">
        
        <!-- Cartão de Perfil (Header) -->
        <header class="glass-panel text-center p-4 mb-4 w-100" style="max-width: 400px;">
            <img src="obanai.png" alt="Welliton Moreira - Cosplay" class="profile-img mb-3 shadow">
            
            <h1 class="h3 fw-bold text-white mb-1">Welliton Moreira</h1>
            <p class="text-light opacity-75 mb-0">Cosplayer</p>
            <span class="badge bg-dark border border-secondary mt-2">蛇柱 | Obanai Iguro</span>
        </header>

        <!-- Botões de Links (Redes Sociais) -->
        <section class="links-container w-100 d-flex flex-column gap-3 mb-4" style="max-width: 400px;">
            <a href="URL_DO_SEU_INSTAGRAM" class="btn glass-btn d-flex align-items-center justify-content-center gap-2 py-3 fw-semibold" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-instagram fs-4"></i> Instagram
            </a>
            <a href="URL_DO_SEU_TIKTOK" class="btn glass-btn d-flex align-items-center justify-content-center gap-2 py-3 fw-semibold" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-tiktok fs-4"></i> TikTok
            </a>
            <a href="mailto:SEU_EMAIL" class="btn glass-btn d-flex align-items-center justify-content-center gap-2 py-3 fw-semibold">
                <i class="fas fa-envelope fs-4"></i> Contato para Fotos
            </a>
        </section>

        <!-- Seção de Galeria Integrada com Lightbox -->
        <section class="gallery-section glass-panel p-4 w-100 text-center" style="max-width: 400px;">
            <h2 class="h5 text-white mb-3 border-bottom pb-2 border-secondary">Galeria de Cosplays</h2>
            <div class="row g-2">
                <!-- Foto 1 -->
                <div class="col-6">
                    <a href="caminho-obanai-alta-resolucao.jpg" data-lightbox="cosplays" data-title="Obanai Iguro">
                        <img src="caminho-obanai-miniatura.jpg" class="img-fluid rounded custom-shadow" alt="Cosplay Obanai Iguro">
                    </a>
                </div>
                <!-- Foto 2 -->
                <div class="col-6">
                    <a href="caminho-kakashi-alta-resolucao.jpg" data-lightbox="cosplays" data-title="Kakashi Hatake (ANBU)">
                        <img src="caminho-kakashi-miniatura.jpg" class="img-fluid rounded custom-shadow" alt="Cosplay Kakashi ANBU">
                    </a>
                </div>
            </div>
        </section>

    </main>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery (Requisito para o Lightbox) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
    <!-- Lightbox JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js"></script>
</body>
</html>
